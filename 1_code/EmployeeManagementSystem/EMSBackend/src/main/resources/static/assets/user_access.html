<!-- Danielle: Manage User Access and Roles screen (UC-7) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <!--------------- Document Metadata & Stylesheet Link --------------->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR - User Access</title>
    <link rel="stylesheet" href="/css/styles.css">

</head>
<body>

<!--------------- Top Header Bar --------------->
<div class="header">
    <strong>Employee Management System</strong>
    <div style="display:flex; align-items:center; gap:16px;">
        <span id="currentUser"></span>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</div>

<!--------------- Global Navigation Bar --------------->
<nav>
    <a href="index.html">Dashboard</a>
    <a href="employees.html">Employee Directory</a>
    <a href="timeoff_employee.html">Time-Off Requests</a>
    <a href="manager_approvals.html">Manager Approvals</a>
    <a href="onboarding.html">Onboarding</a>
    <a href="user_access.html" class="active">User Access</a>
    <a href="profile.html">Profile</a>
</nav>

<!--------------- Main Content Area --------------->
<main>
    <div class="container">
        <h2>MANAGE USER ACCESS</h2>

        <!--------------- User & Role Selection --------------->
        <!-- IDs employeeSelect, roleSelect, assignBtn, and accessFeedback are unchanged
             so user_access.js keeps loading users and saving roles as before. -->
        <div class="access-row">
            <div class="access-field">
                <label for="employeeSelect">Select User:</label>
                <select id="employeeSelect"></select>
            </div>
            <div class="access-field">
                <label for="roleSelect">Assigned System Role:</label>
                <select id="roleSelect">
                    <option value="EMPLOYEE">Employee</option>
                    <option value="MANAGER">Manager</option>
                    <option value="HR_ADMIN">HR Admin</option>
                </select>
            </div>
        </div>

        <!--------------- System Permissions Preview (display only) --------------->
        <div class="preview-panel">
            <div class="preview-box">
                <h3>SYSTEM PERMISSIONS PREVIEW</h3>
                <div class="permission-grid">
                    <label><input type="checkbox" data-perm="viewRecords"> <span>View Employee Records</span></label>
                    <label><input type="checkbox" data-perm="approveTimeOff"> <span>Approve Time-Off Requests</span></label>
                    <label><input type="checkbox" data-perm="deactivateRecords"> <span>Deactivate Employee Records</span></label>
                    <label><input type="checkbox" data-perm="createEditRecords"> <span>Create / Edit Employee Records</span></label>
                    <label><input type="checkbox" data-perm="securitySettings"> <span>Modify Security Settings</span></label>
                </div>
            </div>

            <!--------------- Form Actions --------------->
            <div class="preview-actions">
                <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
                <button type="button" id="assignBtn">Save Access Roles</button>
            </div>
        </div>

        <!--------------- Feedback & Navigation Return Link --------------->
        <p id="accessFeedback"></p>
        <p style="margin-top: 16px;"><a href="employees.html">Back to Directory</a></p>
    </div>
</main>

<!--------------- Page-Specific JavaScript Files --------------->
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/user_access.js"></script>


</body>
</html>
