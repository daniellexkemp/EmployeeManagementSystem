<!-- Danielle: HR Employee Directory screen (UC-1) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <!--------------- Document Metadata & Stylesheet Link --------------->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR - Employee Records</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<!--------------- Top Header Bar --------------->
<div class="header">
    <strong>Employee Management System</strong>
    <div style="display:flex; align-items:center; gap:16px;">
        <span id="currentUser"></span>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</div>

<!--------------- Global Navigation Bar --------------->
<nav>
    <a href="index.html">Dashboard</a>
    <a href="employees.html" class="active">Employee Directory</a>
    <a href="timeoff_employee.html">Time-Off Requests</a>
    <a href="manager_approvals.html">Manager Approvals</a>
    <a href="onboarding.html">Onboarding</a>
    <a href="user_access.html">User Access</a>
    <a href="profile.html">Profile</a>
</nav>

<!--------------- Main Content Area --------------->
<main>
    <div class="container">
        <h1>EMPLOYEE DIRECTORY</h1>

        <!-------------- - Search Controls, Filters & Action Buttons ------------- -->
        <div class="filters">
            <input type="text" id="searchInput" placeholder="Search by name or email...">

            <!---------------  Department Dropdown -------------- -->
            <select id="departmentFilter">
                <option value="">All Departments</option>
            </select>

            <!-- -------------  Status Dropdown ------------- -->
            <select id="statusFilter">
                <option value="">All Statuses</option>
                <option value="ACTIVE">Active</option>
                <option value="ON_LEAVE">On Leave</option>
                <option value="INACTIVE">Inactive</option>
            </select>

            <button id="searchBtn">Filter</button>
            <button type="button" id="addEmployeeBtn">+ Add New Employee</button>
            <button type="button" id="exportBtn">Export CSV</button>
        </div>

        <!--------------- Employee Data Table --------------->
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Job Title</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="employeeTableBody">
            </tbody>
        </table>
    </div>
</main>

<!--------------- Employee View / Edit Modal --------------->
<div id="employeeModal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
            <h2 id="modalTitle">Employee Details</h2>
            <button type="button" id="modalCloseBtn" class="modal-close" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>

<!--------------- Page-Specific JavaScript Files --------------->
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/employee.js"></script>

</body>
</html>
