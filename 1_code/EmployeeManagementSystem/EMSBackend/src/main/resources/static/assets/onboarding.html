<!DOCTYPE html>
<html lang="en">
<head>
    <!--------------- Document Metadata & Stylesheet Link --------------->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR - Onboard Employee</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<!--------------- Top Header Bar --------------->
<div class="header">
    <strong>Employee Management System</strong>
    <div class="header-user">
        <span id="currentUser"></span>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</div>

<!--------------- Global Navigation Bar --------------->
<nav>
    <a href="index.html">Dashboard</a>
    <a href="employees.html">Employee Directory</a>
    <a href="timeoff_employee.html">Time-Off Requests</a>
    <a href="manager_approvals.html">Manager Approvals</a>
    <a href="onboarding.html" class="active">Onboarding</a>
    <a href="user_access.html">User Access</a>
    <a href="profile.html">Profile</a>
</nav>

<!--------------- Main Content Area --------------->
<main id="onboardingMain">
    <h2>CREATE EMPLOYEE RECORD</h2>

    <!--------------- Feedback Notification Display --------------->
    <p id="statusMessage" role="status" hidden></p>

    <!--------------- New Employee Onboarding Form --------------->
    <form id="onboardingForm" novalidate>
        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="First Name" required>
            <span class="field-error" id="firstNameError"></span>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Last Name" required>
            <span class="field-error" id="lastNameError"></span>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="name@company.com" required>
            <span class="field-error" id="emailError"></span>
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="555-0101" required>
            <span class="field-error" id="phoneError"></span>
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" name="department" placeholder="Department" required>
            <span class="field-error" id="departmentError"></span>
        </div>

        <div class="form-group">
            <label for="jobTitle">Job Title</label>
            <input type="text" id="jobTitle" name="jobTitle" placeholder="Job Title" required>
            <span class="field-error" id="jobTitleError"></span>
        </div>


<div class="form-group">
    <label for="supervisorId">Supervisor</label>
    <select id="supervisorId" name="supervisorId">
        <option value="">No Supervisor Assigned</option>
    </select>
</div>



        <button type="submit" id="submitBtn">Complete Onboarding</button>

    </form>

    <!--------------- Return Link to Directory --------------->
    <p class="back-link"><a href="employees.html">Back to Employee Directory</a></p>
</main>

<!--------------- Page-Specific JavaScript Files --------------->
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/onboarding.js"></script>

</body>
</html>
