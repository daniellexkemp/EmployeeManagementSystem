<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Management System</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f4f6f8;
        }

        .login-container {
            background: #fff;
            border: 1px solid #ccc;
            padding: 32px 40px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }

        .login-container h1 {
            margin: 0 0 6px 0;
            font-size: 24px;
            color: #2c3e50;
            text-align: center;
        }

        .login-container .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .login-form .form-group {
            margin-bottom: 16px;
        }

        .login-form label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .login-form input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .login-form input:focus {
            outline: none;
            border-color: #2c3e50;
            box-shadow: 0 0 0 2px rgba(44, 62, 80, 0.15);
        }

        .login-form button[type="submit"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 8px;
            background: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .login-form button[type="submit"]:hover {
            background: #34495e;
        }

        #loginMessage {
            margin-top: 16px;
            padding: 10px 12px;
            font-size: 14px;
            border-radius: 4px;
            text-align: center;
            display: none;
        }

        #loginMessage.error {
            display: block;
            background: #fdecea;
            border: 1px solid #c0392b;
            color: #a33025;
        }

        #loginMessage.success {
            display: block;
            background: #eaf7ee;
            border: 1px solid #1a8a3d;
            color: #1a6b31;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #2c3e50;
            font-weight: bold;
            text-decoration: underline;
        }

        .register-link a:hover {
            color: #34495e;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1>Employee Management System</h1>
    <p class="subtitle">Sign in to your account</p>

    <form class="login-form" id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username" autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit">Sign In</button>
    </form>

    <p id="loginMessage"></p>

    <p class="register-link">
        Don't have an account? <a href="register.html">Register</a>
    </p>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/login.js"></script>

</body>
</html>
