<!-- Susan: View & Update Profile screen (UC-2) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile</title>
    <link rel="stylesheet" href="/css/styles.css">
<style>
   body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

    main {
    max-width: 600px;
    margin: 30px auto;
    background-color: white;
    padding: 30px;
    border: 1px solid #ddd;
    border-radius: 6px;
}

    h1 {
        margin-top: 0;
    }

    form div {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
    }

    input[readonly] {
        background-color: #eeeeee;
    }

    button {
        padding: 8px 16px;
        margin-right: 8px;
        cursor: pointer;
    }

    #message {
        margin-top: 15px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="header">
    <strong>Employee Management System</strong>
    <div style="display:flex; align-items:center; gap:16px;">
        <span id="currentUser"></span>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</div>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="employees.html">Employee Directory</a>
    <a href="timeoff_employee.html">Time-Off Requests</a>
    <a href="manager_approvals.html">Manager Approvals</a>
    <a href="onboarding.html">Onboarding</a>
    <a href="user_access.html">User Access</a>
    <a href="profile.html" class="active">Profile</a>
</nav>

    <main>
        <h1>Employee Profile</h1>
        <p>View your employee information and update your contact information.</p>

        <form id="profileForm">

            <div>
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" readonly>
            </div>

            <div>
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" readonly>
            </div>

            <div>
                <label for="department">Department</label>
                <input type="text" id="department" readonly>
            </div>

            <div>
                <label for="jobTitle">Job Title</label>
                <input type="text" id="jobTitle" readonly>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>

            <div>
                <label for="phone">Phone</label>
                <input type="tel" id="phone" required>
            </div>

            <div>
                <button type="submit">Save</button>
                <button type="button" id="cancelButton">Cancel</button>
                <button type="button" id="backButton">Back</button>
            </div>

            <p id="message"></p>

        </form>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/profile.js"></script>

</body>
</html>
